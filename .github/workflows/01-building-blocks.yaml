name: 01 - building blocks
on: push

jobs:
    echo-hello:
        runs-on: ubuntu-latest
        steps: 
            - name: say hello
              run: echo "Hello World"

    echo-goodbye:
        runs-on: ubuntu-latest
        steps:
            - name: failed step
              run: |
                echo "I will fail"
                exit 0
            - name: say good-bye
              run: echo "good-bye"