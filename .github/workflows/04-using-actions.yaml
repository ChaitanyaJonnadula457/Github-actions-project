name: 04 - using-actions
on: workflow_dispatch
jobs:
    build:
        defaults:
            run:
                working-directory: 04-using-actions/react-app      
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            - name: setup node
              uses: actions/setup-node@v3
              with:
                node-version: '20.x'
            - name: Install dependencies
              run: npm ci
            - name: run unit tests
              run: npm run test



